<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Corrida Neon Simples</title>
    <style>
        body {
            margin: 0;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: sans-serif;
            overflow: hidden;
        }
        #box {
            position: relative;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00f0ff;
            font-size: 20px;
            font-weight: bold;
        }
        #telaFim {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 800px;
            height: 400px;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        #telaFim h1 {
            color: #ff0055;
            margin-bottom: 10px;
        }
        #telaFim button {
            padding: 10px 20px;
            font-size: 16px;
            background: #00f0ff;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div id="box">
    <div id="hud">ESTRELAS: <span id="pontos">0</span></div>
    <canvas id="tela" width="800" height="400"></canvas>
    
    <div id="telaFim">
        <h1>FIM DE JOGO</h1>
        <p>Você pegou <span id="pontosFinais">0</span> estrelas.</p>
        <button onclick="reiniciar()">JOGAR DE NOVO</button>
    </div>
</div>

<script>
const canvas = document.getElementById("tela");
const ctx = canvas.getContext("2d");

const pontosEl = document.getElementById("pontos");
const pontosFinaisEl = document.getElementById("pontosFinais");
const telaFim = document.getElementById("telaFim");

let velocidade = 5;
let score = 0;
let fim = false;
let tempo = 0;
const chaoY = 340;

const jogador = {
    x: 100,
    y: 300,
    largura: 30,
    altura: 40,
    velY: 0,
    gravidade: 0.6,
    forcaPulo: -13,
    noChao: false
};

let obstaculos = [];
let estrelas = [];

window.addEventListener("keydown", function(e) {
    if ((e.code === "Space" || e.code === "ArrowUp") && jogador.noChao && !fim) {
        jogador.velY = jogador.forcaPulo;
        jogador.noChao = false;
    }
});

function criarObstaculo() {
    let tam = Math.floor(Math.random() * 25) + 20;
    obstaculos.push({
        x: canvas.width,
        y: chaoY - tam,
        largura: tam,
        altura: tam
    });
}

function criarEstrela() {
    let alt = Math.floor(Math.random() * 100) + 60;
    estrelas.push({
        x: canvas.width,
        y: chaoY - alt,
        raio: 8
    });
}

function colidiu(r1, r2) {
    return r1.x < r2.x + r2.largura &&
           r1.x + r1.largura > r2.x &&
           r1.y < r2.y + r2.altura &&
           r1.y + r1.altura > r2.y;
}

function loop() {
    if (fim) return;

    tempo++;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Fundo
    ctx.fillStyle = "#1a1525";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Chao
    ctx.fillStyle = "#ff007f";
    ctx.fillRect(0, chaoY, canvas.width, canvas.height - chaoY);

    // Fisica Jogador
    jogador.velY += jogador.gravidade;
    jogador.y += jogador.velY;

    if (jogador.y + jogador.altura >= chaoY) {
        jogador.y = chaoY - jogador.altura;
        jogador.velY = 0;
        jogador.noChao = true;
    }

    // Desenhar Jogador (Ciano)
    ctx.fillStyle = "#00f0ff";
    ctx.fillRect(jogador.x, jogador.y, jogador.largura, jogador.altura);

    // Dificuldade gradual
    if (tempo % 600 === 0) velocidade += 0.5;

    // Gerenciar Obstaculos
    if (tempo % 130 === 0) criarObstaculo();

    for (let i = obstaculos.length - 1; i >= 0; i--) {
        let obs = obstaculos[i];
        obs.x -= velocidade;

        ctx.fillStyle = "#ff0055";
        ctx.fillRect(obs.x, obs.y, obs.largura, obs.altura);

        if (colidiu(jogador, obs)) {
            fim = true;
            pontosFinaisEl.innerText = score;
            telaFim.style.display = "flex";
        }

        if (obs.x + obs.largura < 0) obstaculos.splice(i, 1);
    }

    // Gerenciar Estrelas
    if (tempo % 90 === 0) criarEstrela();

    for (let i = estrelas.length - 1; i >= 0; i--) {
        let est = estrelas[i];
        est.x -= velocidade;

        ctx.fillStyle = "#ffbe0b";
        ctx.beginPath();
        ctx.arc(est.x, est.y, est.raio, 0, Math.PI * 2);
        ctx.fill();

        let caixaEstrela = {
            x: est.x - est.raio,
            y: est.y - est.raio,
            largura: est.raio * 2,
            altura: est.raio * 2
        };

        if (colidiu(jogador, caixaEstrela)) {
            score++;
            pontosEl.innerText = score;
            estrelas.splice(i, 1);
            continue;
        }

        if (est.x + est.raio < 0) estrelas.splice(i, 1);
    }

    requestAnimationFrame(loop);
}

function reiniciar() {
    obstaculos = [];
    estrelas = [];
    score = 0;
    velocidade = 5;
    tempo = 0;
    pontosEl.innerText = "0";
    jogador.y = chaoY - jogador.altura;
    jogador.velY = 0;
    fim = false;
    telaFim.style.display = "none";
    loop();
}

loop();
</script>

</body>
</html>

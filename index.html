<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Saltar Obstáculos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #222;
            font-family: 'Arial', sans-serif;
            color: white;
            overflow: hidden;
            user-select: none;
        }

        #placar {
            margin-bottom: 10px;
            font-size: 20px;
            font-weight: bold;
        }

        #cenario {
            position: relative;
            width: 600px;
            height: 250px;
            background: linear-gradient(to bottom, #87CEEB, #E0F6FF);
            border-bottom: 15px solid #4CAF50;
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            cursor: pointer; /* Mostra que a tela é clicável */
        }

        #personagem {
            position: absolute;
            bottom: 0;
            left: 50px;
            width: 40px;
            height: 40px;
            background-color: #FF5722;
            border-radius: 4px;
            transition: bottom 0.1s ease-out; /* Suporte extra para movimento */
        }

        .pulo {
            animation: pular 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        #obstaculo {
            position: absolute;
            bottom: 0;
            left: 600px;
            width: 25px;
            height: 45px;
            background-color: #333;
            border-radius: 4px;
        }

        #item {
            position: absolute;
            bottom: 100px;
            left: 800px;
            width: 20px;
            height: 20px;
            background-color: #FFD700;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
        }

        #mensagem-gameover {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            width: 220px;
            z-index: 10;
        }

        #mensagem-gameover button {
            margin-top: 12px;
            padding: 8px 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        #instrucoes {
            margin-top: 15px;
            font-size: 14px;
            color: #aaa;
            text-align: center;
        }

        @keyframes pular {
            0% { bottom: 0; }
            50% { bottom: 130px; }
            100% { bottom: 0; }
        }
    </style>
</head>
<body>

    <div id="placar">Fase: <span id="fase">1</span> | Itens: <span id="itens">0</span>/5</div>

    <div id="cenario">
        <div id="personagem"></div>
        <div id="obstaculo"></div>
        <div id="item"></div>

        <div id="mensagem-gameover">
            <h2>Game Over!</h2>
            <p>Você bateu no obstáculo.</p>
            <button id="btn-reiniciar">Jogar Novamente</button>
        </div>
    </div>

    <div id="instrucoes">Pressione **Espaço**, **Seta para Cima** ou **Clique no cenário** para pular.</div>

    <script>
        // Executa apenas quando toda a página estiver 100% carregada
        window.addEventListener('load', () => {
            const personagem = document.getElementById('personagem');
            const obstaculo = document.getElementById('obstaculo');
            const item = document.getElementById('item');
            const txtFase = document.getElementById('fase');
            const txtItens = document.getElementById('itens');
            const msgGameOver = document.getElementById('mensagem-gameover');
            const btnReiniciar = document.getElementById('btn-reiniciar');
            const cenario = document.getElementById('cenario');

            let jogando = true;
            let qtdItens = 0;
            let faseAtual = 1;
            let velocidade = 5;

            let obstaculoX = 600;
            let itemX = 900; 

            // Ouvinte de teclado global ativo
            window.addEventListener('keydown', (event) => {
                if ((event.code === 'Space' || event.code === 'ArrowUp') && jogando) {
                    event.preventDefault(); 
                    pular();
                }
            });

            // Ouvinte de clique direto no cenário para pular
            cenario.addEventListener('click', (event) => {
                if (jogando && event.target !== btnReiniciar) {
                    pular();
                }
            });

            // Ouvinte do botão reiniciar
            btnReiniciar.addEventListener('click', (event) => {
                event.stopPropagation(); // Evita ativar o pulo ao clicar no botão
                reiniciarJogo();
            });

            function pular() {
                if (!personagem.classList.contains('pulo')) {
                    personagem.classList.add('pulo');
                    setTimeout(() => {
                        personagem.classList.remove('pulo');
                    }, 600);
                }
            }

            function loopJogo() {
                if (!jogando) return;

                // Movimentação do obstáculo
                obstaculoX -= velocidade;
                if (obstaculoX < -40) {
                    obstaculoX = 650 + Math.random() * 250;
                }
                obstaculo.style.left = obstaculoX + 'px';

                // Movimentação do item
                itemX -= velocidade;
                if (itemX < -40) {
                    itemX = 750 + Math.random() * 350;
                    item.style.display = 'block';
                }
                item.style.left = itemX + 'px';

                // Detecção de altura em tempo real
                let personagemBottom = parseFloat(window.getComputedStyle(personagem).getPropertyValue('bottom')) || 0;
                
                // Colisão com Obstáculo (Ajustada para o tamanho exato dos blocos)
                if (obstaculoX > 45 && obstaculoX < 85 && personagemBottom < 45) {
                    gameOver();
                    return; 
                }

                // Colisão com o Item
                if (itemX > 45 && itemX < 85 && personagemBottom > 60 && item.style.display !== 'none') {
                    item.style.display = 'none';
                    coletarItem();
                }

                requestAnimationFrame(loopJogo);
            }

            function coletarItem() {
                qtdItens++;
                if (qtdItens >= 5) {
                    faseAtual++;
                    qtdItens = 0;
                    velocidade += 1.5;
                }
                txtFase.innerText = faseAtual;
                txtItens.innerText = qtdItens;
            }

            function gameOver() {
                jogando = false;
                msgGameOver.style.display = 'block';
            }

            function reiniciarJogo() {
                jogando = true;
                qtdItens = 0;
                faseAtual = 1;
                velocidade = 5;
                obstaculoX = 600;
                itemX = 900;
                
                txtFase.innerText = faseAtual;
                txtItens.innerText = qtdItens;
                msgGameOver.style.display = 'none';
                item.style.display = 'block';
                
                loopJogo();
            }

            // Início imediato do fluxo
            loopJogo();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Dash Clone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        canvas {
            background: linear-gradient(to bottom, #1a0b2e, #4c1d95);
            display: block;
            border-radius: 4px;
        }

        #scoreBoard {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            pointer-events: none;
        }

        #menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            border-radius: 4px;
            transition: opacity 0.3s;
        }

        #menu.hide {
            opacity: 0;
            pointer-events: none;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0,255,204,0.5);
        }

        p {
            font-size: 18px;
            margin-bottom: 20px;
            color: #ccc;
        }

        button {
            padding: 12px 30px;
            font-size: 20px;
            font-weight: bold;
            background: #00ffcc;
            color: #111;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
        }

        button:hover {
            background: #00ccff;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <div id="scoreBoard">PONTOS: 0</div>
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <div id="menu">
            <h1 id="menuTitle">GEOMETRY DASH</h1>
            <p id="menuSub">Pressione Espaço ou Clique para Jogar</p>
            <button id="startBtn">JOGAR</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const menu = document.getElementById('menu');
        const menuTitle = document.getElementById('menuTitle');
        const menuSub = document.getElementById('menuSub');
        const startBtn = document.getElementById('startBtn');
        const scoreBoard = document.getElementById('scoreBoard');

        // Configurações do Jogo
        const GRAVITY = 1.4;
        let gameSpeed = 6;
        let score = 0;
        let isPlaying = false;
        let obstacles = [];
        let particles = [];
        let obstacleTimer = 0;

        // Propriedades do Jogador (Cubo)
        const player = {
            x: 100,
            y: 300,
            size: 40,
            ySpeed: 0,
            jumpForce: -17,
            isGrounded: false,
            rotation: 0,
            color: '#00ffcc'
        };

        const floorY = canvas.height - 60;

        // Controles
        function jump() {
            if (player.isGrounded && isPlaying) {
                player.ySpeed = player.jumpForce;
                player.isGrounded = false;
                // Cria partículas no pulo
                createParticles(player.x + player.size/2, player.y + player.size, '#00ffcc', 8);
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (!isPlaying) startGame();
                else jump();
            }
        });

        canvas.addEventListener('mousedown', (e) => {
            if (!isPlaying) startGame();
            else jump();
        });

        startBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            startGame();
        });

        function startGame() {
            isPlaying = true;
            score = 0;
            gameSpeed = 7;
            obstacles = [];
            particles = [];
            player.y = floorY - player.size;
            player.ySpeed = 0;
            player.rotation = 0;
            player.isGrounded = true;
            menu.classList.add('hide');
            scoreBoard.innerText = `PONTOS: ${score}`;
        }

        function gameOver() {
            isPlaying = false;
            menu.classList.remove('hide');
            menuTitle.innerText = "FIM DE JOGO";
            menuTitle.style.color = "#ff3366";
            menuSub.innerText = `Você fez ${score} pontos!`;
            startBtn.innerText = "TENTAR NOVAMENTE";
            
            // Explosão do jogador
            createParticles(player.x + player.size/2, player.y + player.size/2, '#ff3366', 30);
        }

        // Sistema de Partículas para Fluidez
        function createParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    size: Math.random() * 4 + 2,
                    xSpeed: (Math.random() - 0.5) * 8 - (isPlaying ? gameSpeed/3 : 0),
                    ySpeed: (Math.random() - 0.5) * 8,
                    gravity: 0.1,
                    alpha: 1,
                    color: color
                });
            }
        }

        // Loop Principal do Jogo
        function update() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Desenhar Chão Estilizado
            ctx.fillStyle = '#110724';
            ctx.fillRect(0, floorY, canvas.width, canvas.height - floorY);
            ctx.strokeStyle = '#00ffcc';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, floorY);
            ctx.lineTo(canvas.width, floorY);
            ctx.stroke();

            // Rastro do jogador (Efeito visual)
            if (isPlaying && player.isGrounded && Math.random() > 0.4) {
                createParticles(player.x, floorY, '#00ffcc', 1);
            }

            // Gerenciar Partículas
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.xSpeed;
                p.y += p.ySpeed;
                p.ySpeed += p.gravity;
                p.alpha -= 0.02;

                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
                ctx.restore();

                if (p.alpha <= 0) particles.splice(i, 1);
            }

            if (isPlaying) {
                // Física do Jogador
                player.ySpeed += GRAVITY;
                player.y += player.ySpeed;

                // Colisão com o chão
                if (player.y >= floorY - player.size) {
                    player.y = floorY - player.size;
                    player.ySpeed = 0;
                    player.isGrounded = true;
                    // Alinha a rotação ao quadrado perfeito mais próximo ao tocar o chão
                    player.rotation = Math.round(player.rotation / (Math.PI / 2)) * (Math.PI / 2);
                }

                // Rotação Fluída no Ar
                if (!player.isGrounded) {
                    player.rotation += 0.09;
                }

                // Geração de Obstáculos de forma inteligente
                obstacleTimer--;
                if (obstacleTimer <= 0) {
                    let type = Math.random() > 0.55 ? 'spike' : 'block';
                    let doubleSpike = type === 'spike' && Math.random() > 0.7;
                    
                    obstacles.push({
                        x: canvas.width,
                        type: type,
                        width: type === 'spike' ? 30 : 40,
                        height: type === 'spike' ? 38 : 40,
                        double: doubleSpike
                    });
                    // Intervalo aleatório baseado na velocidade do jogo
                    obstacleTimer = Math.random() * 50 + (90 - gameSpeed * 4);
                }

                // Dificuldade progressiva
                gameSpeed += 0.001;
            }

            // Desenhar Jogador (com rotação no próprio centro)
            ctx.save();
            ctx.translate(player.x + player.size / 2, player.y + player.size / 2);
            ctx.rotate(player.rotation);
            ctx.fillStyle = player.color;
            ctx.fillRect(-player.size / 2, -player.size / 2, player.size, player.size);
            // Detalhe interno do cubo (olhos/rosto minimalista)
            ctx.fillStyle = '#111';
            ctx.fillRect(4, -12, 6, 6);
            ctx.fillRect(14, -12, 6, 6);
            ctx.restore();

            // Atualizar e Desenhar Obstáculos
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                if (isPlaying) obs.x -= gameSpeed;

                // Desenho dos Obstáculos
                ctx.fillStyle = '#ff3366';
                if (obs.type === 'spike') {
                    // Desenha Espinho (Triângulo)
                    ctx.beginPath();
                    ctx.moveTo(obs.x, floorY);

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Beat 'Em Up</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: Arial, sans-serif;
        }
        canvas {
            border: 4px solid #fff;
            background: #333;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="800" height="400"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// Estado do Jogo
let fase = 1;
const maxFases = 3;
let jogoAcabou = false;
let vitoria = false;

// Limites do cenário estilo Final Fight (área caminhável no chão)
const chaoTopo = 220;
const chaoFundo = 380;

// Configurações do Jogador
const player = {
    x: 100,
    y: 300,
    width: 40,
    height: 80,
    speed: 4,
    hp: 100,
    maxHp: 100,
    atacando: false,
    tempoAtaque: 0,
    lado: 'direita', // 'esquerda' ou 'direita'
    cor: '#00AAFF'
};

// Lista de Inimigos
let inimigos = [];

// Teclado
const keys = {};
window.addEventListener("keydown", e => { keys[e.key] = true; });
window.addEventListener("keyup", e => { keys[e.key] = false; });

// Inicializar ou avançar de fase
function iniciarFase(numeroFase) {
    player.x = 100;
    player.y = 300;
    inimigos = [];
    
    // Quantidade de inimigos aumenta por fase
    let qtdInimigos = numeroFase * 2; 
    for (let i = 0; i < qtdInimigos; i++) {
        inimigos.push({
            x: 400 + Math.random() * 350,
            y: chaoTopo + Math.random() * (chaoFundo - chaoTopo - 60),
            width: 40,
            height: 80,
            speed: 1.5 + (numeroFase * 0.3),
            hp: 30 + (numeroFase * 10),
            maxHp: 30 + (numeroFase * 10),
            atacando: false,
            tempoAtaque: 0,
            lado: 'esquerda',
            cor: `hsl(${numeroFase * 40}, 80%, 40%)`
        });
    }
}

// Lógica de Movimento e Combate
function atualizar() {
    if (jogoAcabou || vitoria) return;

    // Movimento do Jogador
    if (keys["ArrowLeft"] && player.x > 0) {
        player.x -= player.speed;
        player.lado = 'esquerda';
    }
    if (keys["ArrowRight"] && player.x < canvas.width - player.width) {
        player.x += player.speed;
        player.lado = 'direita';
    }
    if (keys["ArrowUp"] && player.y > chaoTopo) {
        player.y -= player.speed;
    }
    if (keys["ArrowDown"] && player.y < chaoFundo - player.height) {
        player.y += player.speed;
    }

    // Ataque do Jogador (Tecla Z)
    if (keys["z"] || keys["Z"]) {
        if (!player.atacando) {
            player.atacando = true;
            player.tempoAtaque = 10; // frames de duração do soco
            checarAtaqueJogador();
        }
    }

    if (player.atacando) {
        player.tempoAtaque--;
        if (player.tempoAtaque <= 0) player.atacando = false;
    }

    // Atualizar Inimigos
    inimigos.forEach((inimigo, index) => {
        // IA Simples: Persegue o jogador se estiver vivo
        if (inimigo.hp > 0) {
            // Seguir em X
            if (inimigo.x < player.x - 30) {
                inimigo.x += inimigo.speed;
                inimigo.lado = 'direita';
            } else if (inimigo.x > player.x + 30) {
                inimigo.x -= inimigo.speed;
                inimigo.lado = 'esquerda';
            }

            // Seguir em Y (profundidade)
            if (inimigo.y < player.y) {
                inimigo.y += inimigo.speed;
            } else if (inimigo.y > player.y) {
                inimigo.y -= inimigo.speed;
            }

            // Lógica de ataque do inimigo (proximidade)
            let distanciaX = Math.abs(inimigo.x - player.x);
            let distanciaY = Math.abs(inimigo.y - player.y);

            if (distanciaX < 45 && distanciaY < 15 && !inimigo.atacando) {
                inimigo.atacando = true;
                inimigo.tempoAtaque = 15;
                // Dar dano no jogador
                player.hp -= 10;
                if (player.hp <= 0) {
                    player.hp = 0;
                    jogoAcabou = true;
                }
            }

            if (inimigo.atacando) {
                inimigo.tempoAtaque--;
                if (inimigo.tempoAtaque <= 0) inimigo.atacando = false;
            }
        }
    });

    // Limpar inimigos mortos
    inimigos = inimigos.filter(i => i.hp > 0);

    // Avançar de fase se limpar a tela
    if (inimigos.length === 0) {
        if (fase < maxFases) {
            fase++;
            iniciarFase(fase);
        } else {
            vitoria = true;
        }
    }
}

// Checa se o soco do jogador acertou alguém
function checarAtaqueJogador() {
    inimigos.forEach(inimigo => {
        let rangeAtaque = 50;
        let acertouX = false;
        
        // Verifica se o golpe está na direção correta
        if (player.lado === 'direita' && inimigo.x > player.x && inimigo.x < player.x + player.width + rangeAtaque) {
            acertouX = true;
        }
        if (player.lado === 'esquerda' && inimigo.x < player.x && inimigo.x > player.x - rangeAtaque) {
            acertouX = true;
        }

        // Alinhamento de profundidade (eixo Y estilo Final Fight)
        let acertouY = Math.abs(player.y - inimigo.y) < 20;

        if (acertouX && acertouY) {
            inimigo.hp -= 15;
        }
    });
}

// Desenhar Elementos na Tela
function desenhar() {
    // Limpar tela
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Desenhar Cenário (Céu/Parede e Chão)
    ctx.fillStyle = "#222"; // Parede de fundo
    ctx.fillRect(0, 0, canvas.width, chaoTopo);
    ctx.fillStyle = "#444"; // Chão da rua
    ctx.fillRect(0, chaoTopo, canvas.width, canvas.height - chaoTopo);
    
    // Linha do horizonte da rua
    ctx.strokeStyle = "#555";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(0, chaoTopo);
    ctx.lineTo(canvas.width, chaoTopo);
    ctx.stroke();

    // Renderizar Entidades ordenadas por Y (Profundidade / Efeito 2.5D)
    const entidades = [player, ...inimigos];
    entidades.sort((a, b) => a.y - b.y);

    entidades.forEach(ent => {
        // Sombra nos pés
        ctx.fillStyle = "rgba(0, 0, 0, 0.3)";
        ctx.beginPath();
        ctx.ellipse(ent.x + ent.width/2, ent.y + ent.height, 20, 7, 0, 0, Math.PI * 2);
        ctx.fill();

        // Corpo do personagem
        ctx.fillStyle = ent.cor;
        ctx.fillRect(ent.x, ent.y, ent.width, ent.height);

        // Desenhar Punho se estiver atacando
        if (ent.atacando) {
            ctx.fillStyle = "#FFF";
            if (ent.lado === 'direita') {
                ctx.fillRect(ent.x + ent.width, ent.y + 25, 15, 10);
            } else {
                ctx.fillRect(ent.x - 15, ent.y + 25, 15, 10);
            }
        }

        // Barra de Vida acima da cabeça
        ctx.fillStyle = "red";
        ctx.fillRect(ent.x, ent.y - 12, ent.width, 6);
        ctx.fillStyle = "green";
        ctx.fillRect(ent.x, ent.y - 12, ent.width * (ent.hp / ent.maxHp), 6);
    });

    // Interface (UI)
    ctx.fillStyle = "#FFF";
    ctx.font = "20px Arial";
    ctx.fillText(`FASE: ${fase} / ${maxFases}`, 20, 40);
    ctx.fillText(`INIMIGOS RESTANTES: ${inimigos.length}`, 20, 70);

    // Barra de Vida Grande do Jogador
    ctx.fillStyle = "#555";
    ctx.fillRect(550, 20, 230, 25);
    ctx.fillStyle = "#00AAFF";
    ctx.fillRect(550, 20, 230 * (player.hp / player.maxHp), 25);
    ctx.fillStyle = "#FFF";
    ctx.font = "14px Arial";
    ctx.fillText("PLAYER 1", 560, 38);

    // Telas de Fim de Jogo
    if (jogoAcabou) {
        ctx.fillStyle = "rgba(0,0,0,0.8)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "red";
        ctx.font = "50px Arial";
        ctx.fillText("GAME OVER", 260, 200);
    }

    if (vitoria) {
        ctx.fillStyle = "rgba(0,0,0,0.8)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "gold";
        ctx.font = "50px Arial";
        ctx.fillText("VOCÊ VENCEU O JOGO!", 140, 200);
    }
}

// Loop Principal do Jogo
function loop() {
    atualizar();
    desenhar();
    requestAnimationFrame(loop);
}

// Iniciar o jogo na fase 1
iniciarFase(fase);
loop();
</script>

</body>
</html>

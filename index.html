<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Saltar Obstáculos - Pro Cyber</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #0b0c10;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            overflow: hidden;
            user-select: none;
        }

        /* Painel de pontuação moderno */
        #placar {
            margin-bottom: 20px;
            font-size: 22px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #00d2ff;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 20px;
            border-radius: 20px;
            border: 1px solid rgba(0, 210, 255, 0.3);
        }

        #fase, #itens {
            color: #00d2ff;
        }

        /* Cenário Neon */
        #cenario {
            position: relative;
            width: 600px;
            height: 250px;
            background: linear-gradient(180deg, #1f1f38 0%, #0d0d1a 100%);
            border-bottom: 12px solid #00ff88;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.2), inset 0 0 40px rgba(0,0,0,0.6);
            cursor: pointer;
        }

        /* Estrelas de fundo piscando */
        .fundo-efeito {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(white 1px, transparent 0);
            background-size: 40px 40px;
            opacity: 0.15;
        }

        /* Personagem Cyber Neon */
        #personagem {
            position: absolute;
            bottom: 0;
            left: 50px;
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #ff007f, #ff0055);
            border-radius: 8px;
            box-shadow: 0 0 15px #ff007f, inset 0 0 8px rgba(255,255,255,0.6);
            transform-origin: center bottom;
        }

        /* Obstáculo: Espinho */
        #obstaculo {
            position: absolute;
            bottom: 0;
            left: 600px;
            width: 25px;
            height: 45px;
            background: linear-gradient(0deg, #ff3333, #ff0000);
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            filter: drop-shadow(0px 0px 8px #ff3333);
        }

        /* Item: Estrela */
        #item {
            position: absolute;
            bottom: 110px;
            left: 800px;
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #ffe600, #ffb300);
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            filter: drop-shadow(0 0 8px #ffe600);
            animation: girarItem 2s linear infinite;
        }

        /* Menu de Game Over */
        #mensagem-gameover {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 15, 25, 0.95);
            border: 2px solid #ff0055;
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            width: 280px;
            z-index: 10;
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.4);
        }

        #mensagem-gameover h2 {
            color: #ff0055;
            font-size: 26px;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #mensagem-gameover p {
            font-size: 14px;
            color: #ccc;
        }

        #mensagem-gameover button {
            margin-top: 18px;
            padding: 10px 20px;
            background: linear-gradient(90deg, #00ff88, #00b361);
            color: #000;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.4);
            transition: transform 0.2s;
        }

        #mensagem-gameover button:hover {
            transform: scale(1.05);
        }

        #instrucoes {
            margin-top: 20px;
            font-size: 13px;
            color: #666;
            text-align: center;
            letter-spacing: 0.5px;
        }

        #instrucoes code {
            background: #222;
            padding: 2px 6px;
            border-radius: 4px;
            color: #00d2ff;
        }

        @keyframes girarItem {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="placar">FASE: <span id="fase">1</span> &nbsp;|&nbsp; ITENS: <span id="itens">0</span>/5</div>

    <div id="cenario">
        <div class="fundo-efeito"></div>
        <div id="personagem"></div>
        <div id="obstaculo"></div>
        <div id="item"></div>

        <div id="mensagem-gameover">
            <h2>Game Over</h2>
            <p>Você colidiu com o espinho!</p>
            <button id="btn-reiniciar">Jogar Novamente</button>
        </div>
    </div>

    <div id="instrucoes">Segure <code>Espaço</code>, <code>Seta para Cima</code> ou o <code>Clique</code> para pular mais alto.</div>

<script>
window.addEventListener('load', () => {
    const personagem = document.getElementById('personagem');
    const obstaculo = document.getElementById('obstaculo');
    const item = document.getElementById('item');
    const txtFase = document.getElementById('fase');
    const txtItens = document.getElementById('itens');
    const msgGameOver = document.getElementById('mensagem-gameover');
    const btnReiniciar = document.getElementById('btn-reiniciar');
    const cenario = document.getElementById('cenario');

    let jogando = true;
    let qtdItens = 0;
    let faseAtual = 1;
    let velocidadeGeral = 5;
    let obstaculoX = 600;
    let itemX = 900;

    // Variáveis da física baseada em JavaScript
    let personagemY = 0;
    let velocidadeY = 0;
    const gravidade = 0.6;
    const forcaPuloInicial = 11;
    let pressionandoPulo = false;
    let noChao = true;
    let anguloRotacao = 0;

    // Funções de controle do pulo
    function iniciarPulo() {
        if (jogando && noChao) {
            velocidadeY = forcaPuloInicial;
            noChao = false;
            pressionandoPulo = true;
        }
    }

    function finalizarPulo() {
        pressionandoPulo = false;
    }

    // Controles por teclado
    window.addEventListener('keydown', (e) => {
        if ((e.code === 'Space' || e.code === 'ArrowUp') && jogando) {
            e.preventDefault();
            iniciarPulo();
        }
    });
    window.addEventListener('keyup', (e) => {
        if (e.code === 'Space' || e.code === 'ArrowUp') {
            finalizarPulo();
        }
    });

    // Controles por clique do mouse
    cenario.addEventListener('mousedown', (e) => {
        if (e.target !== btnReiniciar) iniciarPulo();
    });
    window.addEventListener('mouseup', finalizarPulo);

    // Controles por toque em celulares
    cenario.addEventListener('touchstart', (e) => {
        if (e.target !== btnReiniciar) {
            e.preventDefault();
            iniciarPulo();
        }
    }, { passive: false });
    window.addEventListener('touchend', finalizarPulo);

    // Evento do botão reiniciar
    btnReiniciar.addEventListener('click', (event) => {
        event.stopPropagation();
        reiniciarJogo();
    });

    // Função de colisão precisa por Hitbox
    function verificarColisao(obj1, obj2, margemX = 0, margemY = 0) {
        const r1 = obj1.getBoundingClientRect();
        const r2 = obj2.getBoundingClientRect();

        return !(
            r1.right - margemX < r2.left + margemX ||
            r1.left + margemX > r2.right - margemX ||
            r1.bottom - margemY < r2.top + margemY ||
            r1.top + margemY > r2.bottom - margemY
        );
    }

    function loopJogo() {
        if (!jogando) return;

        // Física do pulo variável (segurar para pular mais alto)
        if (!noChao) {
            if (!pressionandoPulo && velocidadeY > 3) {
                velocidadeY = 3; 
            }
            
            velocidadeY -= gravidade;
            personagemY += velocidadeY;

            anguloRotacao += 4;
            personagem.style.transform = `rotate(${anguloRotacao}deg) scale(1)`;
        }

        // Detecção de contato com o chão
        if (personagemY <= 0) {
            personagemY = 0;
            velocidadeY = 0;
            if (!noChao) {
                noChao = true;
                anguloRotacao = 0;
                // Animação de impacto (Achatamento rápido)
                personagem.style.transform = 'scaleY(0.75) scaleX(1.2)';
                setTimeout(() => {
                    if(noChao) personagem.style.transform = 'scale(1)';
                }, 80);
            }
        }
        personagem.style.bottom = personagemY + 'px';

        // Animação de esticar ao subir rapidamente
        if (!noChao && velocidadeY > 2) {
            personagem.style.transform = `rotate(${anguloRotacao}deg) scaleY(1.15) scaleX(0.85)`;
        }

        // Movimentação do obstáculo
        obstaculoX -= velocidadeGeral;
        if (obstaculoX < -40) {
            obstaculoX = 650 + Math.random() * 300;
        }
        obstaculo.style.left = obstaculoX + 'px';

        // Movimentação do item
        itemX -= velocidadeGeral;
        if (itemX < -40) {

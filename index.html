<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vector Runner - Cyber Parkour Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="interface">
        <div class="placar-box">FASE: <span id="fase">1</span></div>
        <div class="placar-box">PROGRESSO: <span id="distancia">0</span>%</div>
        <div class="placar-box">MOEDAS: <span id="moedas">0</span></div>
    </div>

    <div id="cenario">
        <div class="silhouette-bg"></div>
        <div id="personagem"></div>
        <div id="linha-chegada"></div>

        <!-- Telas de Estado -->
        <div id="tela-gameover" class="overlay-tela">
            <h2>Capturado!</h2>
            <p>O obstáculo te parou.</p>
            <button id="btn-reiniciar">Tentar Novamente</button>
        </div>

        <div id="tela-vitoria" class="overlay-tela">
            <h2>Fase Concluída!</h2>
            <p>Seu parkour foi perfeito.</p>
            <button id="btn-proximo">Avançar de Fase</button>
        </div>
    </div>

    <div id="instrucoes">
        Pule barreiras com: <code>Espaço</code> ou <code>Seta para Cima</code> <br>
        Deslize sob tetos altos com: <code>Seta para Baixo</code>
    </div>

    <script src="script.js"></script>
</body>
</html>

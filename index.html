<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vector Parkour - VS Code Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="interface">
        <div class="placar-box">FASE: <span id="fase">1</span></div>
        <div class="placar-box">PROGRESSO: <span id="distancia">0</span>%</div>
        <div class="placar-box">MOEDAS: <span id="moedas">0</span></div>
    </div>

    <div id="jogo-container">
        <canvas id="gameCanvas" width="800" height="320"></canvas>

        <!-- Tela de Game Over -->
        <div id="tela-gameover" class="overlay-tela">
            <h2>Capturado!</h2>
            <p>O obstáculo parou sua corrida.</p>
            <button id="btn-reiniciar">Tentar Novamente</button>
        </div>

        <!-- Tela de Vitória -->
        <div id="tela-vitoria" class="overlay-tela">
            <h2>Fase Concluída!</h2>
            <p>Seu parkour foi perfeito.</p>
            <button id="btn-proximo">Avançar de Fase</button>
        </div>
    </div>

    <div id="instrucoes">
        Pule barreiras com: <code>Espaço</code> ou <code>Seta para Cima</code> <br>
        Deslize sob tetos com: <code>Seta para Baixo</code>
    </div>

    <!-- O defer garante a execução apenas após a renderização completa do DOM -->
    <script src="script.js" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry Dash Clone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        #gameContainer {
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            border-radius: 6px;
            overflow: hidden;
        }

        canvas {
            background: linear-gradient(to bottom, #1a0b2e, #4c1d95);
            display: block;
        }

        #scoreBoard {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 26px;
            font-weight: 900;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 10;
        }

        #menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 20;
        }

        #menu.hide {
            display: none;
        }

        h1 {
            font-size: 46px;
            margin-bottom: 10px;
            color: #00ffcc;
            text-shadow: 0 0 15px rgba(0,255,204,0.6);
            font-weight: 800;
        }

        p {
            font-size: 18px;
            margin-bottom: 25px;
            color: #ddd;
        }

        button {
            padding: 14px 40px;
            font-size: 22px;
            font-weight: bold;
            background: #00ffcc;
            color: #111;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 255, 204, 0.4);
            transition: transform 0.1s, background 0.2s, box-shadow 0.2s;
        }

        button:hover {
            background: #00ccff;
            box-shadow: 0 4px 15px rgba(0, 204, 255, 0.4);
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <div id="scoreBoard">PONTOS: 0</div>
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        <div id="menu">
            <h1 id="menuTitle">GEOMETRY DASH</h1>
            <p id="menuSub">Pressione Espaço ou Clique para Jogar</p>
            <button id="startBtn">JOGAR</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const menu = document.getElementById('menu');
        const menuTitle = document.getElementById('menuTitle');
        const menuSub = document.getElementById('menuSub');
        const startBtn = document.getElementById('startBtn');
        const scoreBoard = document.getElementById('scoreBoard');

        // Configurações Físicas Globais
        const GRAVITY = 1.4;
        let gameSpeed = 6.5;
        let score = 0;
        let isPlaying = false;
        let obstacles = [];
        let particles = [];
        let obstacleTimer = 0;
        const floorY = canvas.height - 60;

        // Estrutura Inicial do Jogador
        const player = {
            x: 120,
            y: floorY - 40,
            size: 40,
            ySpeed: 0,
            jumpForce: -16.5,
            isGrounded: true,
            rotation: 0
        };

        // Gerador de Partículas para Efeitos Visuais
        function createParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    size: Math.random() * 4 + 2,
                    xSpeed: (Math.random() - 0.5) * 8 - (isPlaying ? gameSpeed / 3 : 0),
                    ySpeed: (Math.random() - 0.5) * 8 - 2,
                    gravity: 0.15,
                    alpha: 1,
                    color: color
                });
            }
        }

        // Comando de Pulo
        function jump() {
            if (player.isGrounded && isPlaying) {
                player.ySpeed = player.jumpForce;
                player.isGrounded = false;
                createParticles(player.x + 20, player.y + 40, '#00ffcc', 8);
            }
        }

        // Ouvinte de Teclado Global
        window.addEventListener('keydown', function(e) {
            if (e.code === 'Space') {
                e.preventDefault();
                if (!isPlaying) {
                    startGame();
                } else {
                    jump();
                }
            }
        });

        // Ouvinte de Clique para Gameplay
        canvas.addEventListener('mousedown', function() {
            if (isPlaying) {
                jump();
            }
        });

        // Ouvinte de Toque para Celulares
        canvas.addEventListener('touchstart', function(e) {
            e.preventDefault();
            if (isPlaying) {
                jump();
            }
        }, { passive: false });

        // Evento do Botão Iniciar Partida
        startBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            startGame();
        });

        function startGame() {
            isPlaying = true;
            score = 0;
            gameSpeed = 6.5;
            obstacles = [];
            particles = [];
            player.y = floorY - player.size;
            player.ySpeed = 0;
            player.rotation = 0;
            player.isGrounded = true;
            obstacleTimer = 50; 
            scoreBoard.innerText = "PONTOS: 0";
            menu.classList.add('hide');
        }

        function gameOver() {
            isPlaying = false;
            createParticles(player.x + 20, player.y + 20, '#ff3366', 35);
            
            setTimeout(function() {
                menuTitle.innerText = "FIM DE JOGO";
                menuTitle.style.color = "#ff3366";
                menuSub.innerText = "Você alcançou " + score + " pontos!";
                startBtn.innerText = "TENTAR NOVAMENTE";
                menu.classList.remove('hide');
            }, 100);
        }

        // Loop Principal do Jogo (Roda continuamente)
        function update() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Desenhar Chão
            ctx.fillStyle = '#110724';
            ctx.fillRect(0, floorY, canvas.width, canvas.height - floorY);
            ctx.strokeStyle = '#00ffcc';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(0, floorY);
            ctx.lineTo(canvas.width, floorY);
            ctx.stroke();

            // Rastro de poeira do Cubo correndo
            if (isPlaying && player.isGrounded && Math.random() > 0.4) {
                createParticles(player.x, floorY, '#00ffcc', 1);
            }

            // Atualização das Partículas na Tela
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.xSpeed;
                p.y += p.ySpeed;
                p.ySpeed += p.gravity;
                p.alpha -= 0.025;

                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, p.size, p.size);
                ctx.restore();

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            // Lógica Física se o Jogo Estiver Ativo
            if (isPlaying) {
                player.ySpeed += GRAVITY;
                player.y += player.ySpeed;

                // Bloqueio de Queda no Chão
                if (player.y >= floorY - player.size) {
                    player.y = floorY - player.size;
                    player.ySpeed = 0;
                    player.isGrounded = true;
                    player.rotation = Math.round(player.rotation / (Math.PI / 2)) * (Math.PI / 2);
                }

                // Rotacionar enquanto estiver no ar
                if (!player.isGrounded) {
                    player.rotation += 0.09;
                }

                // Controle de Tempo de Geração de Obstáculos
                obstacleTimer--;
                if (obstacleTimer <= 0) {
                    let isSpike = Math.random() > 0.45;
                    let doubleSpike = isSpike && Math.random() > 0.75;
                    
                    obstacles.push({
                        x: canvas.width,
                        type: isSpike ? 'spike' : 'block',
                        width: isSpike ? 30 : 40,
                        height: isSpike ? 36 : 40,
                        double: doubleSpike,
                        counted: false
                    });
                    
                    obstacleTimer = Math.random() * 40 + (100 - gameSpeed * 5);
                }

                // Aceleração progressiva automática
                gameSpeed += 0.0008;
            }

            // Desenhar Cubo Jogador
            ctx.save();
            ctx.translate(player.x + 20, player.y + 20);
            ctx.rotate(player.rotation);
            ctx.fillStyle = '#00ffcc';
            ctx.fillRect(-20, -20, 40, 40);
            
            // Desenhar os olhos do cubo
            ctx.fillStyle = '#111';
            ctx.fillRect(4, -12, 6, 6);
            ctx.fillRect(16, -12, 6, 6);

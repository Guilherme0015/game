<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corrida das Estrelas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        #hud {
            position: absolute;
            top: 15px;
            left: 15px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px #000;
            pointer-events: none;
        }
        #gameOverScreen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 800px;
            height: 400px;
            background: rgba(0, 0, 0, 0.75);
            color: white;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 4px;
        }
        #gameOverScreen h1 {
            font-size: 48px;
            color: #ff4a4a;
            margin-bottom: 10px;
        }
        #gameOverScreen p {
            font-size: 20px;
            margin-bottom: 20px;
        }
        #gameOverScreen button {
            padding: 10px 20px;
            font-size: 18px;
            font-weight: bold;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
        }
        #gameOverScreen button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <div id="hud">Estrelas: <span id="score">0</span></div>
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    
    <div id="gameOverScreen" id="gameOverScreen">
        <h1>Fim de Jogo!</h1>
        <p>Você coletou <span id="finalScore">0</span> estrelas.</p>
        <button onclick="resetGame()">Jogar Novamente</button>
    </div>
</div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// Elementos da Interface (DOM)
const scoreEl = document.getElementById("score");
const finalScoreEl = document.getElementById("finalScore");
const gameOverScreen = document.getElementById("gameOverScreen");

// Configurações do Jogo
let gameSpeed = 5;
let score = 0;
let isGameOver = false;
let frames = 0;

// Propriedades do Chão
const groundY = canvas.height - 50;

// Objeto do Jogador (Quadrado Azul)
const player = {
    x: 100,
    y: groundY - 40,
    width: 30,
    height: 40,
    color: "#00b4d8",
    velocityY: 0,
    gravity: 0.6,
    jumpForce: -14,
    isGrounded: false
};

// Listas de objetos na tela
let obstacles = [];
let stars = [];

// Captura de comandos (Espaço, Seta para Cima ou Toque na Tela)
window.addEventListener("keydown", (e) => {
    if ((e.code === "Space" || e.code === "ArrowUp") && player.isGrounded && !isGameOver) {
        player.velocityY = player.jumpForce;
        player.isGrounded = false;
    }
});
canvas.addEventListener("touchstart", () => {
    if (player.isGrounded && !isGameOver) {
        player.velocityY = player.jumpForce;
        player.isGrounded = false;
    }
});

// Função para gerar obstáculos aleatórios
function spawnObstacle() {
    let size = Math.floor(Math.random() * 30) + 20; // tamanhos variados
    obstacles.push({
        x: canvas.width,
        y: groundY - size,
        width: size,
        height: size,
        color: "#e63946"
    });
}

// Função para gerar estrelas coletáveis
function spawnStar() {
    let heightVariation = Math.floor(Math.random() * 120) + 50; // alturas diferentes
    stars.push({
        x: canvas.width,
        y: groundY - heightVariation,
        size: 12,
        color: "#ffbe0b"
    });
}

// Detecção de Colisão Estilo AABB (Caixa delimitadora)
function checkCollision(rect1, rect2) {
    return rect1.x < rect2.x + rect2.width &&
           rect1.x + rect1.width > rect2.x &&
           rect1.y < rect2.y + rect2.height &&
           rect1.y + rect1.height > rect2.y;
}

// Loop Principal do Jogo
function gameLoop() {
    if (isGameOver) return;

    frames++;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // ---- 1. DESENHAR CENÁRIO ----
    // Fundo do Céu
    ctx.fillStyle = "#1e1e2f";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    // Chão
    ctx.fillStyle = "#2a9d8f";
    ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

    // ---- 2. FÍSICA E MOVIMENTO DO JOGADOR ----
    player.velocityY += player.gravity;
    player.y += player.velocityY;

    // Colisão com o chão
    if (player.y + player.height >= groundY) {
        player.y = groundY - player.height;
        player.velocityY = 0;
        player.isGrounded = true;
    }

    // Desenhar Jogador
    ctx.fillStyle = player.color;
    ctx.fillRect(player.x, player.y, player.width, player.height);

    // Aumentar velocidade gradualmente conforme o tempo passa
    if (frames % 500 === 0) gameSpeed += 0.5;

    // ---- 3. GERENCIAR OBSTÁCULOS ----
    if (frames % 120 === 0) spawnObstacle(); // Cria a cada 2 segundos aprox.

    for (let i = obstacles.length - 1; i >= 0; i--) {
        let obs = obstacles[i];
        obs.x -= gameSpeed;

        // Desenhar Obstáculo
        ctx.fillStyle = obs.color;
        ctx.fillRect(obs.x, obs.y, obs.width, obs.height);

        // Checar colisão com jogador
        if (checkCollision(player, obs)) {
            endGame();
        }

        // Remover do array se sair da tela
        if (obs.x + obs.width < 0) obstacles.splice(i, 1);
    }

    // ---- 4. GERENCIAR ESTRELAS ----
    if (frames % 80 === 0) spawnStar(); // Cria estrelas de forma alternada

    for (let i = stars.length - 1; i >= 0; i--) {
        let star = stars[i];
        star.x -= gameSpeed;

        // Desenhar Estrela (Formato simplificado de losango/brilho)
        ctx.fillStyle = star.color;
        ctx.beginPath();
        ctx.moveTo(star.x, star.y - star.size);
        ctx.lineTo(star.x + star.size, star.y);
        ctx.lineTo(star.x, star.y + star.size);
        ctx.lineTo(star.x - star.size, star.y);
        ctx.closePath();
        ctx.fill();

        // Caixa de colisão virtual para a estrela
        let starBox = { x: star.x - star.size, y: star.y - star.size, width: star.size * 2, height: star.size * 2 };

        // Checar coleta da estrela
        if (checkCollision(player, starBox)) {
            score++;
            scoreEl.innerText = score;
            stars.splice(i, 1);
            continue;
        }

        // Remover se sair da tela
        if (star.x + star.size < 0) stars.splice(i, 1);
    }

    requestAnimationFrame(gameLoop);
}

// Finaliza a rodada
function endGame() {
    isGameOver = true;
    finalScoreEl.innerText = score;
    gameOverScreen.style.display = "flex";
}

// Reinicia os parâmetros para jogar de novo
function resetGame() {
    obstacles = [];
    stars = [];
    score = 0;
    gameSpeed = 5;
    frames = 0;
    scoreEl.innerText = score;
    player.y = groundY - player.height;
    player.velocityY = 0;
    isGameOver = false;
    gameOverScreen.style.display = "none";
    gameLoop();
}

// Iniciar o jogo
gameLoop();
</script>

</body>
</html>
